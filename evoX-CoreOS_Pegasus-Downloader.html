<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>evoX-CoreOS - Pegasus Store</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #080c14;
      --panel: #0e1626;
      --panel-hover: #131e33;
      --line: #1c2b42;
      --text: #eaf1fa;
      --muted: #7c93b3;
      --brand-red: #ff0055;
      --brand-red-hover: #e6004c;
      --accent-blue: #0088ff;
      --accent-cyan: #00d9ff;
      --badge-bg: #152238;
      --shadow: 0 12px 40px rgba(0,0,0,0.6);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 10% 20%, rgba(0, 136, 255, 0.05) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP NAVBAR UI EVOX */
    .top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      max-width: 1450px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 20px;
    }
    .brand span.evo { color: var(--text); }
    .brand span.X { color: var(--brand-red); margin-right: 4px; }
    .brand span.sub { color: var(--text); }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* CONTROLS BAR */
    .controls-wrapper {
      background: rgba(14, 22, 38, 0.4);
      border-bottom: 1px solid var(--line);
      padding: 16px 24px;
    }
    .controls {
      max-width: 1450px;
      margin: auto;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search { flex: 1; min-width: 260px; position: relative; }
    .search input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #09101d;
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .search input:focus { border-color: var(--brand-red); box-shadow: 0 0 12px rgba(255, 0, 85, 0.2); }
    .search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    
    .select, .viewbtn {
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #09101d;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .select:hover, .viewbtn:hover { border-color: var(--muted); }
    .viewbtn.active { background: var(--brand-red); border-color: var(--brand-red); color: #fff; }

    /* HERO STATS */
    .hero { max-width: 1450px; margin: 25px auto 10px; padding: 0 24px; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
    .stat { background: var(--panel); border: 1px solid var(--line); padding: 8px 16px; border-radius: 30px; color: var(--muted); font-size: 0.88rem; }
    .stat b { color: var(--text); }

    /* CATALOG CONTAINER */
    main { max-width: 1450px; margin: auto; padding: 20px 24px 60px; width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: var(--brand-red);
      box-shadow: 0 8px 30px rgba(255, 0, 85, 0.15);
    }
    .poster { aspect-ratio: 2/2.6; background: #060a12; overflow: hidden; position: relative; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .card:hover .poster img { transform: scale(1.05); }
    
    .info { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
    .title { font-weight: 700; font-size: 0.98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .badge { font-size: 0.75rem; background: var(--badge-bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted); font-weight: 500; }
    .badge.red { border-color: rgba(255, 0, 85, 0.3); color: var(--brand-red); }

    /* LIST VIEW */
    .list { display: none; }
    .list .row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 16px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .list .row:hover { border-color: var(--brand-red); background: var(--panel-hover); }
    .list .thumb { width: 60px; height: 75px; border-radius: 8px; overflow: hidden; background: #000; }
    .list img { width: 100%; height: 100%; object-fit: cover; }
    .open-btn {
      background: var(--brand-red);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .empty { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 1.1rem; }

    /* MODAL FICHE JEU (Style evoX CoreOS) */
    dialog {
      width: min(850px, 92vw);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #09101c;
      color: var(--text);
      padding: 0;
      box-shadow: var(--shadow);
      margin: auto;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px); }
    
    .modal-container {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      padding: 28px;
      position: relative;
    }
    .modal-poster { width: 100%; aspect-ratio: 2/2.7; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); }
    .modal-poster img { width: 100%; height: 100%; object-fit: cover; }
    .modal-details h2 { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 8px; padding-right: 40px; }
    
    .modal-close {
      position: absolute; right: 20px; top: 20px;
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; width: 36px; height: 36px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--brand-red); border-color: var(--brand-red); }

    /* SECTION DES LIENS DANS LA FICHE */
    .link-group {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .link-group-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .link-group-title.game { color: var(--accent-cyan); }
    .link-group-title.dlc { color: #ffb703; }
    .link-group-title.backport { color: #e76f51; }
    .link-group-title.other { color: var(--muted); }

    .host-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #080d17;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .host-row:last-child { margin-bottom: 0; }
    
    .host-name {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .host-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .parts-select {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .dl-btn-action {
      background: var(--brand-red);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .dl-btn-action:hover { background: var(--brand-red-hover); }

    @media(max-width: 768px) {
      .modal-container { grid-template-columns: 1fr; }
      .modal-poster { max-width: 200px; margin: 0 auto; }
      .host-row { flex-direction: column; align-items: stretch; }
      .host-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="top">
    <div class="nav">
      <div class="brand">
        <i class="fa-solid fa-cube" style="color: var(--brand-red)"></i>
        <div><span class="evo">evo</span><span class="X">X</span><span class="sub">CoreOS</span></div>
      </div>
      <div class="nav-user">
        <i class="fa-brands fa-github"></i>
        <span>nexgen999</span>
      </div>
    </div>
    
    <div class="controls-wrapper">
      <div class="controls">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="q" placeholder="Rechercher un jeu, ID, catégorie...">
        </div>
        <select id="catalog" class="select">
          <option value="pfs">PFS Catalog</option>
          <option value="dlps">DLPS Catalog</option>
          <option value="pippo">Pippo Catalog</option>
        </select>
        <button class="viewbtn active" id="gridBtn" title="Grille"><i class="fa-solid fa-border-all"></i></button>
        <button class="viewbtn" id="listBtn" title="Liste"><i class="fa-solid fa-list"></i></button>
      </div>
    </div>
  </header>

  <!-- STATS -->
  <section class="hero">
    <div class="stats">
      <div class="stat">Catalogue : <b id="catName">PFS</b></div>
      <div class="stat">Total paquets : <b id="count">0</b></div>
      <div class="stat">Source : <b>GitHub Pages</b></div>
    </div>
  </section>

  <!-- STORE CONTENT -->
  <main>
    <div id="grid" class="grid"></div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty" hidden><i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i> Aucun élément trouvé.</div>
  </main>

  <!-- FICHE JEU / MODAL -->
  <dialog id="dlg">
    <div class="modal-container">
      <button class="modal-close" id="close"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-poster">
        <img id="mImg" src="" alt="Cover">
      </div>
      <div class="modal-details">
        <h2 id="mTitle"></h2>
        <div class="badges" id="mBadges"></div>
        <div id="mLinks"></div>
      </div>
    </div>
  </dialog>

<script>
const SOURCES = {
  dlps: [
    "https://nexgen999.github.io/evoX-CoreOS/json/pegasus-dl/dlps.json",
    "https://raw.githubusercontent.com/nexgen999/evoX-CoreOS/main/json/pegasus-dl/dlps.json",
    "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://raw.githubusercontent.com/nexgen999/evoX-CoreOS/main/json/pegasus-dl/dlps.json")
  ],
  pfs: [
    "https://nexgen999.github.io/evoX-CoreOS/json/pegasus-dl/pfs.json",
    "https://raw.githubusercontent.com/nexgen999/evoX-CoreOS/main/json/pegasus-dl/pfs.json",
    "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://raw.githubusercontent.com/nexgen999/evoX-CoreOS/main/json/pegasus-dl/pfs.json")
  ],
  pippo: [
    "https://nexgen999.github.io/evoX-CoreOS/json/pegasus-dl/pippo.json",
    "https://raw.githubusercontent.com/nexgen999/evoX-CoreOS/main/json/pegasus-dl/pippo.json",
    "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://raw.githubusercontent.com/nexgen999/evoX-CoreOS/main/json/pegasus-dl/pippo.json")
  ]
};

const state = { items: [], view: "grid" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function formatSize(val) {
  if (!val || val === "N/A") return "Taille inconnue";
  if (typeof val === 'string' && (val.includes('GB') || val.includes('MB'))) return val;
  let n = Number(val);
  if (isNaN(n)) return val;
  let u = ["B", "KB", "MB", "GB", "TB"], i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 ? 0 : 1) + " " + u[i];
}

function normalizeItem(x) {
  return {
    title: x.title || x.name || "Sans titre",
    titleId: x.id || x.titleId || x.game_id || x.pkg_id || "ID Inconnu",
    icon: x.image || x.posterUrl || x.icon || x.cover || "",
    size: formatSize(x.size || x.sizeBytes || x.file_size),
    version: x.version || x.app_ver || "1.00",
    category: x.category || x.region || "PS5",
    rawLinks: x.links || x.downloadLinks || x.urls || (x.url ? [x.url] : [])
  };
}

async function load() {
  const key = $("catalog").value;
  $("catName").textContent = key.toUpperCase();
  $("grid").innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Chargement du catalogue...</div>';
  $("list").innerHTML = "";
  $("empty").hidden = true;

  let loadedData = null;
  for (let url of SOURCES[key]) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (res.ok) { loadedData = await res.json(); break; }
    } catch (e) {}
  }

  if (loadedData) {
    let rawItems = Array.isArray(loadedData) ? loadedData : (loadedData.packages || loadedData.games || loadedData.items || []);
    state.items = rawItems.map(normalizeItem);
    render();
  } else {
    state.items = [];
    $("grid").innerHTML = "";
    $("empty").hidden = false;
    $("empty").textContent = "Erreur de chargement du catalogue JSON.";
  }
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  return state.items.filter(x => !q || [x.title, x.titleId, x.category, x.version].some(v => String(v ?? "").toLowerCase().includes(q)));
}

function render() {
  const items = filtered();
  $("count").textContent = items.length;
  $("empty").hidden = items.length !== 0;

  $("grid").style.display = state.view === "grid" ? "grid" : "none";
  $("list").style.display = state.view === "list" ? "block" : "none";

  $("grid").innerHTML = items.map((x, i) => card(x, i)).join("");
  $("list").innerHTML = items.map((x, i) => row(x, i)).join("");
}

function card(x, i) {
  const fallback = "https://via.placeholder.com/300x400/0e1626/7c93b3?text=evoX+Store";
  return `
    <article class="card" data-i="${i}">
      <div class="poster">
        <img loading="lazy" src="${esc(x.icon)}" onerror="this.src='${fallback}'" alt="">
      </div>
      <div class="info">
        <div class="title">${esc(x.title)}</div>
        <div class="meta">${esc(x.titleId)} · ${esc(x.size)}</div>
        <div class="badges">
          <span class="badge red">${esc(x.category)}</span>
          <span class="badge">v${esc(x.version)}</span>
        </div>
      </div>
    </article>`;
}

function row(x, i) {
  const fallback = "https://via.placeholder.com/100/0e1626/7c93b3?text=evoX";
  return `
    <article class="row" data-i="${i}">
      <div class="thumb"><img loading="lazy" src="${esc(x.icon)}" onerror="this.src='${fallback}'" alt=""></div>
      <div>
        <div class="title">${esc(x.title)}</div>
        <div class="meta">${esc(x.titleId)} · ${esc(x.size)} · v${esc(x.version)}</div>
      </div>
      <button class="open-btn">Ouvrir</button>
    </article>`;
}

// ALGORITHME DE PARSING DES LIENS (HÉBERGEURS + MENUS DÉROULANTS + SECTIONS)
function parseLinks(rawLinks) {
  const categories = { game: [], dlc: [], backport: [], other: [] };

  let flatten = [];
  if (Array.isArray(rawLinks)) {
    rawLinks.forEach((l, idx) => {
      if (typeof l === 'string') flatten.push({ label: `Part ${idx+1}`, url: l });
      else if (typeof l === 'object') flatten.push({ label: l.name || l.label || `Lien ${idx+1}`, url: l.url || l.link || '' });
    });
  } else if (typeof rawLinks === 'object' && rawLinks !== null) {
    Object.keys(rawLinks).forEach(k => {
      let val = rawLinks[k];
      if (Array.isArray(val)) val.forEach((u, i) => flatten.push({ label: `${k} (Part ${i+1})`, url: u }));
      else flatten.push({ label: k, url: val });
    });
  }

  // Tri par catégorie (Game, DLC, Backport)
  flatten.forEach(item => {
    let str = (item.label + ' ' + item.url).toLowerCase();
    if (str.includes('backport') || str.includes('fix')) categories.backport.push(item);
    else if (str.includes('dlc') || str.includes('addon')) categories.dlc.push(item);
    else if (str.includes('pkg') || str.includes('part') || str.includes('game') || str.includes('v1.') || str.includes('1.00')) categories.game.push(item);
    else categories.other.push(item);
  });

  return categories;
}

// Détection du nom de l'hébergeur (1Fichier, Mega, Rapidgator...)
function getHostName(url) {
  let u = url.toLowerCase();
  if (u.includes('1fichier')) return '1Fichier';
  if (u.includes('mega.nz') || u.includes('mega.co')) return 'Mega';
  if (u.includes('rapidgator')) return 'Rapidgator';
  if (u.includes('uptobox')) return 'Uptobox';
  if (u.includes('zippyshare')) return 'Zippyshare';
  if (u.includes('drive.google')) return 'Google Drive';
  if (u.includes('mediafire')) return 'Mediafire';
  return 'Direct Link / Inconnu';
}

// Regroupe par hébergeur et génère la liste déroulante s'il y a plusieurs parties
function renderCategoryGroup(title, cssClass, icon, items) {
  if (!items || items.length === 0) return '';

  // Regroupement par hébergeur
  const hosts = {};
  items.forEach(it => {
    let host = getHostName(it.url);
    if (!hosts[host]) hosts[host] = [];
    hosts[host].push(it);
  });

  let html = `
    <div class="link-group">
      <div class="link-group-title ${cssClass}">
        <i class="${icon}"></i> ${title}
      </div>
  `;

  Object.keys(hosts).forEach(hostName => {
    let list = hosts[hostName];
    let uniqueId = 'select_' + Math.random().toString(36).substr(2, 9);

    html += `<div class="host-row">
      <div class="host-name"><i class="fa-solid fa-server" style="color:var(--muted)"></i> ${hostName}</div>
      <div class="host-actions">`;

    if (list.length === 1) {
      // Un seul lien pour cet hébergeur
      html += `<a href="${esc(list[0].url)}" target="_blank" rel="noopener noreferrer" class="dl-btn-action">
        <i class="fa-solid fa-download"></i> Télécharger (${esc(list[0].label)})
      </a>`;
    } else {
      // Plusieurs liens -> Menu déroulant !
      html += `<select id="${uniqueId}" class="parts-select">`;
      list.forEach((item, idx) => {
        html += `<option value="${esc(item.url)}">${esc(item.label)}</option>`;
      });
      html += `</select>
      <button onclick="window.open(document.getElementById('${uniqueId}').value, '_blank')" class="dl-btn-action">
        <i class="fa-solid fa-download"></i> Télécharger
      </button>`;
    }

    html += `</div></div>`;
  });

  html += `</div>`;
  return html;
}

function openItem(index) {
  const x = filtered()[index];
  if (!x) return;

  const fallback = "https://via.placeholder.com/300x400/0e1626/7c93b3?text=evoX+Store";
  $("mImg").src = x.icon || fallback;
  $("mTitle").textContent = x.title;

  $("mBadges").innerHTML = [
    `<span class="badge red">${esc(x.category)}</span>`,
    `<span class="badge">${esc(x.titleId)}</span>`,
    `<span class="badge">v${esc(x.version)}</span>`,
    `<span class="badge">${esc(x.size)}</span>`
  ].join('');

  const parsed = parseLinks(x.rawLinks);

  let linksHTML = "";
  linksHTML += renderCategoryGroup("Fichiers du Jeu (PKGs / Parts)", "game", "fa-solid fa-gamepad", parsed.game);
  linksHTML += renderCategoryGroup("Contenus Téléchargeables (DLC)", "dlc", "fa-solid fa-puzzle-piece", parsed.dlc);
  linksHTML += renderCategoryGroup("Fixes & Backports", "backport", "fa-solid fa-screwdriver-wrench", parsed.backport);
  linksHTML += renderCategoryGroup("Autres Liens & Miroirs", "other", "fa-solid fa-link", parsed.other);

  $("mLinks").innerHTML = linksHTML || `<div style="text-align:center; padding:20px; color:var(--muted)">Aucun lien direct n'a été trouvé pour cet élément.</div>`;

  $("dlg").showModal();
}

// EVENTS
$("q").addEventListener("input", render);
$("catalog").addEventListener("change", load);

$("gridBtn").onclick = () => {
  state.view = "grid";
  $("gridBtn").classList.add("active");
  $("listBtn").classList.remove("active");
  render();
};

$("listBtn").onclick = () => {
  state.view = "list";
  $("listBtn").classList.add("active");
  $("gridBtn").classList.remove("active");
  render();
};

$("close").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-i]");
  if (el && !e.target.closest('button')) openItem(Number(el.dataset.i));
});

// LOAD ON START
load();
</script>
</body>
</html>
